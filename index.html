<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>비바의 도시 출장 보고서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위쪽 '출장 일정표'(단계 줄) + 가운데 작업 화면(왼쪽 보고서 칸 · 오른쪽 조사 도우미) + 아래 이동 버튼.
   '도시 탐구소'(9차시)의 파랑·주황, 통통한 버튼 모양을 그대로 잇는 단일 밝은 테마입니다. */
:root{
  color-scheme:light;
  --navy:#22336B; --navy-d:#17244C;
  --blue:#3D6BE0; --blue-d:#2B53BE; --blue-l:#8FAAF4;
  --orange:#E96A1E; --orange-d:#B84F0F; --orange-l:#FFEFE0;
  --amber:#FFB53D; --amber-d:#E09318;
  --stamp:#D8432F;
  --sky:#E9F1FE; --ground:#F7F8FC; --paper:#FFFFFF;
  --line:#D7DEEE; --edge:#D9DCED;
  --ink:#1D2A52; --ink-soft:#5B6884;
  --display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 86% 8%,#FFE8CE 0,transparent 26%),radial-gradient(circle at 14% 88%,#E2ECFF 0,transparent 32%),var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,p,label,li{word-break:keep-all}
img{max-width:100%;display:block}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue-d)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ---------- 틀 ---------- */
.app{display:flex;flex-direction:column;height:100%}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px;color:#fff;background:linear-gradient(115deg,#22336B,#3D6BE0 70%,#5A85EC);box-shadow:0 5px 0 #1B2A5A;z-index:3}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand-mark{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:3px solid #fff;background:var(--sky)}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-t{font-family:var(--display);font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:13px;color:#D6E2FB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:13px;font-weight:700;background:#ffffff24;border-radius:999px;padding:6px 12px;white-space:nowrap}
.tbtn{flex:0 0 auto;border:2px solid #ffffffa8;border-radius:14px;background:#ffffff24;box-shadow:0 4px 0 #1B2A5A;padding:8px 13px;font-size:15px;font-weight:700;color:#fff;white-space:nowrap}
.tbtn:active{transform:translateY(4px);box-shadow:none}
.tbtn.warn{background:var(--amber);color:#4d3c1a;border-color:#fff}

.steps{flex:0 0 auto;background:#FFFAFC;border-bottom:2px solid #E6E4F4;overflow-x:auto}
.steps-in{display:flex;gap:8px;padding:10px 18px;min-width:max-content}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:15px;white-space:nowrap}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--sky);color:var(--navy);font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.step .pg{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.step.done .n{background:var(--stamp);color:#fff}
.step.is-now{background:var(--navy);border-color:var(--navy);box-shadow:0 4px 0 var(--navy-d);color:#fff}
.step.is-now .pg{color:#D6E2FB}
.step.is-now .n{background:var(--amber);color:#4d3c1a}

.scroller{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;min-height:0}
.screen{max-width:1280px;margin:0 auto;padding-block:26px 34px;padding-inline:clamp(16px,3vw,36px)}
.navbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:11px 18px;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px));background:#FFFAFC;border-top:2px solid #E6E4F4}
.navbar .sp{flex:1 1 auto}

/* ---------- 공통 부품 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;min-height:54px;font-weight:700;font-size:18px;color:#fff;text-decoration:none;border:2px solid #354AB5;border-radius:17px;background:linear-gradient(#6883F2,#526CE2);box-shadow:0 6px 0 #354AB5;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #354AB5}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #354AB5}
.btn.ghost{background:#fff;color:var(--navy);border-color:#CBD0EC;box-shadow:0 6px 0 #CBD0EC}
.btn.ghost:hover{box-shadow:0 8px 0 #AEB8E7}
.btn.go{background:linear-gradient(#FFD27A,#FFB53D);border-color:var(--amber-d);color:#4d3c1a;box-shadow:0 6px 0 var(--amber-d)}
.btn.go:hover{box-shadow:0 8px 0 var(--amber-d)}
.btn.sm{padding:8px 14px;min-height:44px;font-size:15px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.eyebrow{display:inline-block;background:var(--navy);color:#fff;font-size:14px;font-weight:700;padding:6px 15px;border-radius:999px;margin-bottom:10px}
.eyebrow.o{background:var(--orange)}
h1.title{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.8vw,46px);line-height:1.25;margin:0 0 10px;color:var(--navy);text-wrap:balance}
.lede{margin:0 0 18px;color:var(--ink-soft);font-size:clamp(16px,1.8vw,20px);max-width:60ch}
.viva{display:flex;align-items:center;gap:12px;margin:0 0 20px}
.viva-pic{width:60px;height:60px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:3px solid #fff;outline:3px solid var(--orange);background:var(--sky)}
.viva-pic img{width:100%;height:100%;object-fit:cover}
.viva-say{position:relative;background:var(--paper);border:2px solid var(--orange);border-radius:20px;padding:10px 18px;box-shadow:0 5px 0 #FBD9BC;max-width:62ch;min-width:0}
.viva-say b{color:var(--orange-d)}
.card{background:var(--paper);border:2px solid #E0E3F2;border-radius:22px;box-shadow:0 7px 0 var(--edge);padding:20px;min-width:0}
.card h2{font-family:var(--display);font-weight:400;font-size:23px;margin:0 0 4px;color:var(--navy);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .k{width:34px;height:34px;border-radius:11px;background:var(--blue-d);color:#fff;font-size:17px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.card.o h2 .k{background:var(--orange)}
.card h2 .ok{margin-left:auto;font-family:var(--body);font-size:13px;font-weight:700;color:#fff;background:var(--stamp);border-radius:999px;padding:3px 11px}
.card .q{margin:0 0 12px;color:var(--ink-soft);font-size:16px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font-size:14px;color:var(--ink-soft)}
label.lb{display:block;font-weight:700;font-size:16px;margin:12px 0 6px}
textarea,input[type=text]{width:100%;background:#fff;border:3px solid #DBE0F2;border-radius:15px;padding:11px 14px;line-height:1.6;font-size:17px;outline:none}
textarea:focus,input[type=text]:focus{border-color:var(--blue-l);box-shadow:0 0 0 4px #9CACF642}
textarea{resize:vertical;min-height:84px}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.inline > div{flex:1 1 150px;min-width:0}
.inline label.lb{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #CBD1EB;border-radius:999px;background:#fff;box-shadow:0 4px 0 #CBD1EB;padding:7px 15px;min-height:44px;font-size:16px;font-weight:700;display:inline-flex;align-items:center}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 #CBD1EB}
.chip.on{background:var(--blue);border-color:#20459F;box-shadow:0 4px 0 #20459F;color:#fff}
.chip.f.on{background:var(--orange);border-color:var(--orange-d);box-shadow:0 4px 0 var(--orange-d)}
.fb{margin-top:10px;border-radius:14px;padding:9px 14px;font-size:15px;font-weight:700;background:var(--sky);color:var(--navy)}
.fb.warn{background:var(--orange-l);color:#8A4A12}

/* ---------- 표지 ---------- */
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);border-radius:28px;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 0 #D5DCEE;background:#fff}
.hero > img{width:100%;height:100%;min-height:300px;object-fit:cover;object-position:42% 60%}
.hero-card{padding:clamp(18px,2.8vw,38px);background:linear-gradient(160deg,#fff,#EEF4FF);border-right:8px solid var(--orange);min-width:0}
.hero-card h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,3.6vw,50px);line-height:1.2;margin:12px 0 8px;color:var(--navy)}
.hero-card h1 em{font-style:normal;color:var(--blue);background:linear-gradient(transparent 62%,#FFDFA8 62%)}
.hero-card p{margin:0 0 14px;color:var(--ink-soft)}
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:22px}
.dest button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#4E7AE4,#2B53BE);box-shadow:0 6px 0 #1B3A8C}
.dest button:nth-child(even){background:linear-gradient(135deg,#F39A4A,#DF6B18);box-shadow:0 6px 0 #9C430B}
.dest button:active{transform:translateY(5px);box-shadow:none}
.dest i{font-style:normal;width:44px;height:44px;border-radius:14px;background:#ffffff38;font-family:var(--display);font-size:22px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.dest b{display:block;font-family:var(--display);font-weight:400;font-size:23px;line-height:1.2}
.dest span{font-size:14px}

/* ---------- 출장 준비 ---------- */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.tool{display:flex;flex-direction:column;gap:8px}
.tool h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0;color:var(--navy)}
.tool .who{font-size:13px;font-weight:700;color:var(--orange-d);background:var(--orange-l);border-radius:999px;padding:2px 10px;align-self:flex-start}
.tool p{margin:0;font-size:15px;color:var(--ink-soft);flex:1 1 auto}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;margin:0;padding:0;list-style:none;counter-reset:how}
.how li{counter-increment:how;border-radius:18px;padding:16px;color:#fff;background:var(--blue-d);box-shadow:0 6px 0 #1B3A8C}
.how li:nth-child(2){background:#4E7AE4}
.how li:nth-child(3){background:#EE8A33;box-shadow:0 6px 0 var(--orange-d)}
.how li:nth-child(4){background:#DF6B18;box-shadow:0 6px 0 #9C430B}
.how li::before{content:counter(how);font-family:var(--display);font-size:32px;line-height:1;display:block;margin-bottom:6px}
.how b{display:block;font-size:18px}
.how span{font-size:15px}
.sect{font-family:var(--display);font-weight:400;font-size:25px;color:var(--navy);margin:26px 0 12px}

/* ---------- 도시 화면 ---------- */
.banner{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 7px 0 #26336F2C;margin-bottom:20px;background:var(--navy);min-height:150px;display:flex;align-items:flex-end}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.banner-t{position:relative;padding:18px 22px;color:#fff;flex:1 1 auto;min-width:0}
.banner-t small{font-weight:700;font-size:14px;background:var(--orange);border-radius:999px;padding:4px 12px}
.banner-t h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vw,52px);line-height:1.2;margin:8px 0 0;text-shadow:0 3px 0 #17244C}
.seal{position:relative;margin:14px 18px;flex:0 0 auto;width:96px;height:96px;border-radius:50%;border:4px dashed #ffffffa0;color:#ffffffd0;font-size:13px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.3}
.seal.on{border:5px double var(--stamp);background:#fff;color:var(--stamp);font-family:var(--display);font-size:19px;transform:rotate(-10deg)}
.work{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.help{position:sticky;top:8px;background:#FFFCF7;border:2px solid #F3C193;border-radius:22px;box-shadow:0 7px 0 #F3C193;padding:18px;min-width:0}
.help h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 10px;color:#8A4A12}
.help h3{font-size:15px;margin:16px 0 6px;color:var(--navy)}
.help ol,.help ul{margin:0;padding-left:20px;font-size:15px}
.help li{margin-bottom:4px}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:block;text-decoration:none;background:#fff;border:2px solid #CBD0EC;border-radius:14px;box-shadow:0 4px 0 #CBD0EC;padding:8px 12px;font-weight:700;font-size:15px;color:var(--navy)}
.links a span{display:block;font-weight:400;font-size:13px;color:var(--ink-soft)}
.links a:active{transform:translateY(3px);box-shadow:0 1px 0 #CBD0EC}
.nm{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--sky)}
.nm label.lb{margin-top:0}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wd{border:2px solid #CBD1EB;border-radius:10px;background:#fff;padding:4px 11px;font-size:15px;font-weight:700;min-height:38px}
.wd.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bank-t{font-size:13px;color:var(--ink-soft);margin:8px 0 0}
.think{margin-top:14px;border-left:6px solid var(--amber);background:#FFF8EA;border-radius:0 14px 14px 0;padding:10px 14px;font-size:15px}
.think b{color:#8A4A12}
.think ul{margin:4px 0 0;padding-left:20px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:14px}
.role{border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.role b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--navy)}
.role p{margin:0 0 8px;font-size:14px;color:var(--ink-soft)}
.role .chip{min-height:40px;padding:4px 13px;font-size:15px}
.owner{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;background:#ffffff30;border-radius:999px;padding:3px 12px}
.guide{counter-reset:g;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.guide li{counter-increment:g;position:relative;padding:12px 14px 12px 58px;border:2px solid var(--line);border-radius:16px;background:#fff}
.guide li::before{content:counter(g);position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:11px;background:var(--blue-d);color:#fff;font-family:var(--display);font-size:19px;display:flex;align-items:center;justify-content:center}
.guide b{display:block;color:var(--navy)}
.guide span{font-size:15px;color:var(--ink-soft)}
.maps{display:flex;flex-direction:column;gap:6px}
.mp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:2px solid #CBD0EC;border-radius:14px;padding:6px 10px}
.mp b{flex:1 1 120px;font-size:15px;color:var(--navy);min-width:0}
.mp a{flex:0 0 auto;text-decoration:none;font-size:13px;font-weight:700;color:#fff;background:var(--blue-d);border-radius:999px;padding:4px 11px}
.mp a + a{background:var(--orange)}
.lv{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:2px 10px;background:var(--blue-d);vertical-align:1px}
.lv.lv2{background:var(--orange)}
.lv.lv3{background:var(--navy)}
.book{background:var(--sky);border-radius:14px;padding:10px 14px;font-size:15px}
.book ul{margin-top:6px}
.book b{color:var(--blue-d)}

/* ---------- 비교 ---------- */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.bar-row > b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--navy)}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;min-width:0}
.bar i{display:block;height:20px;border-radius:0 8px 8px 0;background:var(--blue-l);min-width:3px;flex:0 0 auto}
.bar.mine i{background:var(--orange)}
.bar span{font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar.none span{color:var(--ink-soft);font-weight:400}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;font-weight:700;margin-bottom:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--blue-l);margin-right:6px;vertical-align:-2px}
.legend i.m{background:var(--orange)}
.tscroll{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
table.cmp th{background:var(--navy);color:#fff;white-space:nowrap}
table.cmp td:first-child{font-weight:700;white-space:nowrap;background:var(--sky)}
.empty{color:#8E97B3}

/* ---------- 보고서 ---------- */
.sheet{background:#fff;border:2px solid #E0E3F2;border-radius:22px;box-shadow:0 7px 0 var(--edge);padding:clamp(16px,3vw,30px)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--navy);padding-bottom:12px;margin-bottom:14px}
.sheet-h h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,38px);margin:0;color:var(--navy);display:flex;align-items:center;gap:10px}
.sheet-h h2 img{width:52px;height:52px;border-radius:50%}
.sign{border-collapse:collapse;font-size:13px;text-align:center}
.sign th,.sign td{border:1px solid var(--ink);padding:3px 10px;min-width:70px}
.sign td{height:46px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;margin-bottom:16px}
.meta b{color:var(--ink-soft);margin-right:6px}
.rc{margin-bottom:18px}
.rc h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 6px;color:#fff;background:var(--blue-d);display:inline-block;padding:3px 16px;border-radius:10px 10px 0 0}
.rc:nth-of-type(even) h3{background:var(--orange)}
.rc table{width:100%;border-collapse:collapse;font-size:15px}
.rc th,.rc td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
.rc th{width:8.5em;background:var(--sky);color:var(--navy)}
.rc td{white-space:pre-wrap;overflow-wrap:anywhere}

@media (max-width:980px){
  .hero,.work{grid-template-columns:1fr}
  .hero > img{aspect-ratio:16/9;min-height:0;order:-1}
  .hero-card{border-right:0;border-top:8px solid var(--orange)}
  .help{position:static;order:-1}
}
@media (max-width:640px){
  .brand-s,.saved{display:none}
  .tbtn{padding:7px 9px;font-size:13px}
  .brand-t{font-size:19px}
  .seal{width:76px;height:76px;font-size:12px;margin:10px}
  .seal.on{font-size:16px}
  .btn{padding:10px 16px;font-size:16px;min-height:50px}
  .rc th{width:5.5em}
}
@media (prefers-reduced-motion:reduce){.btn,.chip{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><img src="assets/viva_mascot.jpg" alt="출장 가는 비바"></div>
      <div style="min-width:0">
        <div class="brand-t">비바의 도시 출장 보고서</div>

/* "381,542" · "38만 1542" · "약 38만 명" 모두 숫자로 읽습니다 */
function num(v){
  var s = String(v||"").replace(/,/g,""), m = s.match(/([\d.]+)\s*만\s*(\d*)\s*(천?)/);
  if (m) return Math.round(parseFloat(m[1])*10000 + (m[2]?parseInt(m[2],10)*(m[3]?1000:1):0));
  var d = s.replace(/[^\d]/g,""); return d ? parseInt(d,10) : null;
}
function man(n){ n = Math.abs(n); return n>=10000 ? "약 "+Math.round(n/10000).toLocaleString("ko-KR")+"만 명" : "약 "+Math.round(n/1000)+"천 명"; }
function popNote(c){

  var diff = n - c.tb;
  if (Math.abs(diff) < 5000) return {t:n.toLocaleString("ko-KR")+"명 · 교과서(2022년 "+c.tbT+")와 거의 같아요."};
  return {t:n.toLocaleString("ko-KR")+"명 · 교과서(2022년 "+c.tbT+")보다 "+man(diff)+" "+(diff>0?"늘었어요.":"줄었어요.")};
}

      '<li><b>샘보드에서 함께 봅니다</b><span>샘보드에 모인 모둠 보고서를 화면에 띄워 도시마다 무엇이 같고 다른지 견주어 봅니다.</span></li></ol></div>'+
    '<div class="card"><h2>교통 이름 낱말 카드</h2><p style="margin:0">교통 칸의 낱말 카드에는 네 도시의 교통 이름과 다른 지역의 이름(인천항, 청주 국제공항, 장항선 등)이 섞여 있습니다. 학생이 지도와 누리집에서 확인한 이름만 고르도록 지도해 주세요. 정답은 따로 드린 선생님용 정답표에 있습니다.</p></div>'+
    '<div class="card"><h2>지도 사용 안내</h2><p style="margin:0">도시 화면의 ‘지도로 찾아보기’는 네이버 지도와 구글 지도의 검색 결과를 새 탭으로 엽니다. 실제 공장과 기관 이름을 찾기에 좋지만, 검색 결과에 가게 광고나 별점·후기가 함께 보일 수 있습니다. 학교 기기에서 두 지도가 열리는지 미리 확인해 주세요.</p></div>'+
    '<div class="card"><h2>개인 정보</h2><p style="margin:0">이 웹앱은 학생 이름을 묻지 않습니다. 모둠 이름과 모둠 안 번호만 쓰며, 입력한 내용은 그 기기의 브라우저에만 저장됩니다. ‘처음부터’를 누르면 모두 지워집니다.</p></div></div>';
};

var scroller = document.getElementById("scroller");
SCREENS.forEach(function(s){
  var sec = document.createElement("section");
  sec.className = "screen"; sec.id = "s-"+s.id; sec.hidden = true; sec.innerHTML = BUILD[s.id]();
  scroller.appendChild(sec);
});

/* ===================== 단계 줄 ===================== */
var stepsEl = document.getElementById("steps");
stepsEl.innerHTML = SCREENS.map(function(s,i){
  if (s.aside) return "";
  return '<button class="step" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span>'+s.label+'</span>'+(s.city?'<span class="pg" data-pg="'+s.id+'"></span>':'')+'</button>';
}).join("");
stepsEl.addEventListener("click", function(e){ var b = e.target.closest(".step"); if (b) go(+b.dataset.i); });

function refreshCity(c){
  var sec = document.getElementById("s-"+c.id), n = doneCount(c), all = n===NEED.length;
  NEED.forEach(function(k){ sec.querySelector('[data-part="'+k+'"] .ok').hidden = !filled(c,k); });
  var seal = sec.querySelector(".seal");
  seal.classList.toggle("on", all);
  seal.innerHTML = all ? "출장<br>완료" : "여섯 칸을<br>채우면<br>도장 쾅";
  var on = arr(c.id+".tra"), nms = sec.querySelectorAll(".nm");
  for (var i=0;i<nms.length;i++){
    nms[i].hidden = on.indexOf(nms[i].dataset.nm)<0;
    var have = names(val(c.id+".tn"+i)), ws = nms[i].querySelectorAll(".wd");
    for (var w=0;w<ws.length;w++){ var has = have.indexOf(ws[w].dataset.w)>=0; ws[w].classList.toggle("on", has); ws[w].setAttribute("aria-pressed", String(has)); }
  }
  var fb = sec.querySelector(".fb"), note = popNote(c);
  fb.hidden = !note; if (note){ fb.textContent = note.t; fb.classList.toggle("warn", !!note.warn); }
  var step = stepsEl.querySelector('[data-pg="'+c.id+'"]');
  step.textContent = all ? "완료" : n+"/"+NEED.length;
  step.parentNode.classList.toggle("done", all);
}

/* ===================== 비교 · 보고서 ===================== */
function show(v){ return String(v).trim() ? esc(v) : '<span class="empty">아직 쓰지 않았어요</span>'; }
function join(a, extra){ var t = a.join(", "); if (extra && String(extra).trim()) t += (t?"\n":"")+extra; return t; }
function popText(c){
  var n = num(val(c.id+".pop")); if (n==null) return "";
  var y = val(c.id+".popYear").trim(); return n.toLocaleString("ko-KR")+"명"+(y?" ("+y+")":"");
}
function renderCompare(){
  var vals = CITIES.map(function(c){ return num(val(c.id+".pop")); });
  var max = Math.max.apply(null, CITIES.map(function(c,i){ return Math.max(c.tb, vals[i]||0); }));
  document.getElementById("bars").innerHTML = CITIES.map(function(c,i){
    var v = vals[i];
    return '<div class="bar-row"><b>'+c.short+'</b><div>'+
      '<div class="bar"><i style="width:'+(c.tb/max*78).toFixed(1)+'%"></i><span>'+c.tbT+'</span></div>'+
      (v!=null ? '<div class="bar mine"><i style="width:'+(v/max*78).toFixed(1)+'%"></i><span>'+v.toLocaleString("ko-KR")+'명</span></div>'
               : '<div class="bar none"><span>아직 조사하지 않았어요</span></div>')+'</div></div>';
  }).join("");
  document.getElementById("cmpTable").innerHTML = '<table class="cmp"><thead><tr><th>도시</th><th>인구</th><th>교통</th><th>산업</th><th>발달한 기능</th></tr></thead><tbody>'+
    CITIES.map(function(c){ var p = c.id+".";
      return '<tr><td>'+c.short+'</td><td>'+show(popText(c))+'</td><td>'+show(arr(p+"tra").join(", "))+'</td><td>'+show(join(arr(p+"indC"), val(p+"ind")))+'</td><td>'+show(arr(p+"func").join(", "))+'</td></tr>';
    }).join("")+'</tbody></table>';
}
function rows(c){
  var p = c.id+".", why = val(p+"why").trim();
  return [["인구", popText(c)],
          ["교통", [arr(p+"tra").map(function(t){ var nm = names(val(p+"tn"+TRA_T.indexOf(t))).join(", "); return nm ? t+": "+nm : t; }).join("\n"), val(p+"traNote").trim()].filter(Boolean).join("\n")],
          ["산업", [arr(p+"indC").join(", "), val(p+"org").trim() ? "찾은 이름: "+val(p+"org").trim() : "", val(p+"ind").trim()].filter(Boolean).join("\n")],
          ["발달한 기능", join(arr(p+"func"), why ? "왜냐하면 "+why : "")],
          ["새로 알게 된 점", val(p+"new")],
          ["출처", arr(p+"src").join(", ")]];
}
var CMP = [["도시가 넓어진 모습","cmp.urban"],["비슷한 점","cmp.same"],["다른 점","cmp.diff"],["기억에 남는 도시","cmp.best"]];
function renderReport(){
  document.getElementById("sheet").innerHTML =
    '<div class="sheet-h"><h2><img src="'+MASCOT+'" alt="">도시 출장 보고서</h2>'+
      '<table class="sign"><tr><th>모둠</th><th>선생님 확인</th></tr><tr><td>'+esc(val("team.name"))+'</td><td></td></tr></table></div>'+
    '<div class="meta"><span><b>모둠</b>'+show(val("team.name"))+'</span><span><b>출장 날짜</b>'+show(val("team.date"))+'</span><span><b>출장지</b>세종 · 부산 · 전주 · 울산</span></div>'+
    '<div class="meta"><span><b>맡은 일</b>'+esc(roleText())+'</span></div>'+
    CITIES.map(function(c){
      return '<div class="rc"><h3>'+c.name+'</h3><table>'+rows(c).map(function(r){ return '<tr><th>'+r[0]+'</th><td>'+show(r[1])+'</td></tr>'; }).join("")+'</table></div>';
    }).join("")+
    '<div class="rc"><h3>네 도시 비교</h3><table>'+CMP.map(function(r){ return '<tr><th>'+r[0]+'</th><td>'+show(val(r[1]))+'</td></tr>'; }).join("")+'</table></div>';
}
function roleText(){ return ROLES.map(function(r){ var o = owners(r.id); return r.t+" "+(o.length?o.join("·"):"미정"); }).join(" / "); }
function reportText(){
  var out = ["[도시 출장 보고서]", "모둠: "+val("team.name"), "출장 날짜: "+val("team.date"), "맡은 일: "+roleText(), ""];
  CITIES.forEach(function(c){
    out.push("■ "+c.name);
    rows(c).forEach(function(r){ out.push("- "+r[0]+": "+(String(r[1]).trim().replace(/\n/g," / ")||"(빈칸)")); });
    out.push("");
  });
  out.push("■ 네 도시 비교");
  CMP.forEach(function(r){ out.push("- "+r[0]+": "+(val(r[1]).trim()||"(빈칸)")); });
  return out.join("\n");
}

/* ===================== 이동 ===================== */
function go(i){
  i = Math.max(0, Math.min(SCREENS.length-1, i));
  S.screen = i; save();
  var secs = scroller.children, st = stepsEl.children;
  for (var k=0;k<secs.length;k++) secs[k].hidden = k!==i;
  for (var m=0;m<st.length;m++) st[m].classList.toggle("is-now", m===i);
  if (st[i] && st[i].scrollIntoView) st[i].scrollIntoView({block:"nearest", inline:"center"});
  document.getElementById("teacherBtn").classList.toggle("warn", i===TEACHER);
  var id = SCREENS[i].id;
  if (id==="compare") renderCompare();
  if (id==="report") renderReport();
  document.getElementById("prevBtn").disabled = i===0;
  var nb = document.getElementById("nextBtn");
  nb.disabled = i>=LAST;
  nb.textContent = i===0 ? "출장 떠나기 ▶" : (i>=LAST ? "마지막 화면" : "다음 ▶");

  scroller.scrollTop = 0;
  try{ history.replaceState(null,"","#"+id); }catch(e){}
}
document.getElementById("nextBtn").addEventListener("click", function(){ go(S.screen+1); });
document.getElementById("prevBtn").addEventListener("click", function(){ go(S.screen-1); });
var backTo = 0;
document.getElementById("teacherBtn").addEventListener("click", function(){
  if (S.screen===TEACHER) go(backTo); else { backTo = S.screen; go(TEACHER); }
});


/* ===================== 입력 ===================== */
function cityOfKey(k){ var id = k.split(".")[0]; return CITIES.filter(function(c){ return c.id===id; })[0]; }
scroller.addEventListener("input", function(e){
  var k = e.target.dataset && e.target.dataset.k; if (!k) return;
  S.d[k] = e.target.value;
  clearTimeout(saveT); saveT = setTimeout(save, 250);
  var c = cityOfKey(k); if (c) refreshCity(c);
});
scroller.addEventListener("click", function(e){
  var nb = e.target.closest("[data-n]");
  if (nb){ S.d["team.n"] = nb.dataset.n; renderRoles(); save(); return; }
  var wd = e.target.closest(".wd");
  if (wd){
    var bk = wd.parentNode.dataset.bank, list = names(val(bk)), wi = list.indexOf(wd.dataset.w);
    if (wi>=0) list.splice(wi,1); else list.push(wd.dataset.w);
    S.d[bk] = list.join(", "); save();
    document.getElementById("f-"+bk).value = S.d[bk];
    refreshCity(cityOfKey(bk)); return;
  }
  var chip = e.target.closest(".chip");
  if (chip){
    var k = chip.parentNode.dataset.chips, v = chip.dataset.v, a = arr(k).slice(), at = a.indexOf(v);
    if (at>=0) a.splice(at,1); else a.push(v);
    S.d[k] = a; save();
    chip.classList.toggle("on", at<0); chip.setAttribute("aria-pressed", String(at<0));
    var c = cityOfKey(k); if (c) refreshCity(c);
    if (k.indexOf("role.")===0) refreshTeam();
    return;
  }
  var g = e.target.closest("[data-go]");
  if (g) go(SCREENS.map(function(s){ return s.id; }).indexOf(g.dataset.go));
});

/* 처음부터 — 두 번 눌러야 지워집니다 */
(function(){
  var b = document.getElementById("resetBtn"), t = null;
  b.addEventListener("click", function(){
    if (!b.classList.contains("warn")){
      b.classList.add("warn"); b.textContent = "모두 지울까요? 한 번 더";
      t = setTimeout(function(){ b.classList.remove("warn"); b.textContent = "처음부터"; }, 4000);
      return;
    }
    clearTimeout(t);
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  });
})();

/* 저장 — 뷰어의 downloads 기능이 있을 때만 그림 저장 버튼을 보여 줍니다 */
(function(){
  var btn = document.getElementById("saveImg"), hint = document.getElementById("saveHint"), dl = null;
  if (window.claude && window.claude.use){
    window.claude.use("downloads").then(function(d){ if (d){ dl = d; btn.hidden = false; } }).catch(function(){});
  } else btn.hidden = false;   /* 일반 누리집에서는 브라우저 내려받기로 저장합니다 */
  function direct(blob, filename){
    var a = document.createElement("a"), u = URL.createObjectURL(blob);
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 5000);
  }
  btn.addEventListener("click", function(){
    if (typeof html2canvas !== "function"){ hint.textContent = "이 화면에서는 그림으로 저장할 수 없어요. ‘글로 복사’를 써 보세요."; return; }
    btn.disabled = true; hint.textContent = "그림을 만들고 있어요…";
    html2canvas(document.getElementById("sheet"), {backgroundColor:"#ffffff", scale:2, logging:false}).then(function(cv){
      return new Promise(function(res, rej){ cv.toBlob(function(b){ b ? res(b) : rej(new Error("blob")); }, "image/png"); });
    }).then(function(blob){
      var name = (val("team.name").trim() || "모둠").replace(/[\\/:*?"<>|]/g,"");
      var fname = "도시 출장 보고서_"+name+".png";
      return dl ? dl.save({filename:fname, data:blob}) : direct(blob, fname);
    }).then(function(){ hint.textContent = "저장했어요."; })
      .catch(function(err){
        hint.textContent = err && err.code==="declined" ? "저장을 취소했어요." : "그림으로 저장하지 못했어요. ‘글로 복사’를 써 보세요.";
      }).then(function(){ btn.disabled = false; });
  });
  document.getElementById("copyTxt").addEventListener("click", function(){
    var text = reportText();
    function fallback(){
      var t = document.createElement("textarea"); t.value = text; t.rows = 8; t.setAttribute("aria-label","보고서 글");
      t.style.marginTop = "14px"; document.getElementById("sheet").after(t); t.select();
      hint.textContent = "아래 칸의 글을 길게 눌러 복사하세요.";
    }
    try{ navigator.clipboard.writeText(text).then(function(){ hint.textContent = "복사했어요. 붙여넣기 하면 돼요."; }, fallback); }catch(e){ fallback(); }
  });
})();

/* ===================== 시작 ===================== */
renderRoles();
CITIES.forEach(refreshCity);
var start = S.screen, h = (location.hash||"").slice(1);
SCREENS.forEach(function(s,i){ if (s.id===h) start = i; });
go(start);
})();
</script>
